name: Wake up Streamlit App

on:
  # Schedule to run every 10 hours.
  # Streamlit free apps sleep after 12 hours of inactivity.
  # This interval ensures the app stays awake.
  schedule:
    - cron: '0 */10 * * *'
  # Allow running the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the keepalive commit below.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ping app to keep it awake
        # Streamlit Community Cloud bounces every request through an
        # auth-check redirect that sets a cookie before returning the
        # app; without -L/-c/-b that redirect loops instead of resolving.
        run: curl -sSf -L -c /tmp/cookies.txt -b /tmp/cookies.txt https://lespapas.streamlit.app/ -o /dev/null

      - name: Keep repo active so GitHub doesn't disable this schedule
        # GitHub auto-disables scheduled workflows after 60 days without
        # repository activity. This pushes a single empty commit to a
        # side branch (never main) purely to count as that activity.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan keepalive
          git rm -rf . > /dev/null 2>&1 || true
          git commit --allow-empty -m "keepalive: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin keepalive
